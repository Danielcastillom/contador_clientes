name: Compilar Windows Executable (.exe)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde la pestaña Actions en GitHub

jobs:
  build-windows:
    name: Compilar versión para Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 💙 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Habilitar soporte para Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: 📦 Precache Windows
        run: flutter precache --windows

      - name: 📦 Obtener dependencias del proyecto
        run: flutter pub get

      - name: 🏗️ Compilar ejecutable para Windows en modo Release
        run: flutter build windows --release

      - name: 📋 Incluir librerías redistribuibles de Visual C++ (MSVCP140.dll, VCRUNTIME140.dll)
        shell: powershell
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $sysDir = "C:\Windows\System32"
          Copy-Item -Path "$sysDir\msvcp140*.dll" -Destination $releaseDir -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$sysDir\vcruntime140*.dll" -Destination $releaseDir -Force -ErrorAction SilentlyContinue

      - name: 📤 Subir Carpeta del Ejecutable y DLLs como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: contador_clientes_windows
          path: build/windows/x64/runner/Release/
          retention-days: 30
